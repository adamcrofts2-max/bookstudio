name: CI

# Every push and every pull request. Until now the only thing standing
# between a broken build and `main` was remembering to run three commands by
# hand — CLAUDE.md requires `npm run build` and `npm run lint` to be clean on
# every commit, and this is what actually enforces it.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile,
      # so CI can never pass against a dependency tree the repo doesn't
      # actually pin.
      - run: npm ci

      # Typecheck + bundle. `npm run build` runs `tsc -b` first, which is the
      # step that has historically caught what `tsc --noEmit` alone missed
      # (see docs/STATUS.md's Phase 124 note on an invalid prop that only the
      # real build rejected).
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Copy that describes dragging, hovering or a sidebar, in a component
      # that can render on a phone. Static, needs no browser, and catches the
      # defect that shipped three times before anyone noticed.
      - name: Audit user-facing copy
        run: npm run audit:copy

  # The browser suites run in their own job, deliberately.
  #
  # Playwright stays out of `package.json` on purpose (see
  # `scripts/e2e/runner.mjs`): it pulls a browser download and roughly doubles
  # install time, and every check in `verify` above runs without one. But
  # "not a dependency" had quietly come to mean "never runs in CI", so five
  # suites — writing, spell-check, structure, export and project deletion —
  # protected nothing between one person remembering to run them and the
  # next.
  #
  # Installing it here, in a job of its own, costs the contributors nothing
  # and gets the suites running on every push. `verify` is not blocked on it,
  # so a browser-infrastructure failure can never masquerade as a broken
  # build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned, and installed alongside the project rather than into it, so
      # the lockfile the `verify` job installs stays untouched.
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # The suites serve `dist/`, so it has to exist first.
      - name: Build
        run: npm run build

      # Runtime health across ~25 surfaces: no uncaught errors, unhandled
      # rejections or failed requests.
      - name: Runtime audit
        run: npm run test:audit

      # Writing, spell-check, structural pages + Develop, every export
      # format, and project deletion.
      - name: Browser suites
        run: npm run test:e2e

